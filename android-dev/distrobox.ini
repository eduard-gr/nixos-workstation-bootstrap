# Android development container.
#
#   distrobox assemble create --file /etc/nixos/android-dev/distrobox.ini
#   distrobox enter android -- /etc/nixos/android-dev/install-android-studio.sh
#
# Recreate from scratch (e.g. after editing this file):
#   distrobox assemble create --replace --file /etc/nixos/android-dev/distrobox.ini
#
# $HOME is shared with the host, so the SDK (~/Android/Sdk), AVDs
# (~/.android/avd), Gradle caches (~/.gradle) and Android Studio itself
# (~/.local/share/android-studio) survive a container rebuild.

[android]
image=docker.io/library/ubuntu:24.04
pull=true
init=false
start_now=true
# NVIDIA integration in distrobox looks for the driver in FHS paths and does
# not find it on NixOS; the emulator renders on the AMD iGPU through Mesa.
nvidia=false

# Gradle, sdkmanager and the command-line build. Android Studio ships its own
# JBR for the IDE; this JDK is for ./gradlew in a terminal.
additional_packages="openjdk-17-jdk-headless git curl wget unzip zip file ca-certificates"
# Native builds (NDK/CMake projects).
additional_packages="build-essential cmake ninja-build pkg-config python3"
# IDE UI (IntelliJ platform on X11/XWayland).
additional_packages="libxtst6 libxi6 libxrender1 libxrandr2 libxcursor1 libxcomposite1 libxdamage1 libxkbfile1 libxkbcommon-x11-0 libxcb-cursor0 libfreetype6 libfontconfig1 fonts-dejavu-core libsecret-1-0 libnss3 libgtk-3-0t64"
# Emulator: GL/Vulkan through Mesa, audio through PulseAudio (pipewire-pulse on the host).
additional_packages="libgl1 libegl1 libgbm1 libdrm2 libvulkan1 mesa-vulkan-drivers libpulse0 libasound2t64 libbz2-1.0 libtinfo6 libncurses6"
